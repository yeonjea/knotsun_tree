<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>낯선대학 계보 네트워크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/layout-base/layout-base.js"></script>
<script src="https://unpkg.com/cose-base/cose-base.js"></script>
<script src="https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg-0: #06070f;
    --bg-1: #0d0f22;
    --bg-2: #14162e;
    --glass: rgba(20, 22, 45, 0.55);
    --glass-strong: rgba(28, 30, 58, 0.85);
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text: #ecedf5;
    --text-dim: #8891ad;
    --text-muted: #5a6180;
    --cyan: #00d9ff;
    --magenta: #ff3d9a;
    --violet: #a855f7;
    --gold: #ffd54f;
    --orange: #ff8a65;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: var(--text);
    background: var(--bg-0);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.18), transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(0, 217, 255, 0.15), transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(255, 61, 154, 0.10), transparent 60%),
      linear-gradient(135deg, var(--bg-0), var(--bg-1) 50%, var(--bg-0));
    z-index: -1;
    animation: bgFloat 30s ease-in-out infinite alternate;
  }
  @keyframes bgFloat {
    0%   { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.15) translate(-3%, -2%); }
  }
  #app { display: flex; height: 100vh; }

  /* ─── 사이드바 (글래스) ────────────────── */
  #sidebar {
    width: 340px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border-right: 1px solid var(--border);
    padding: 24px 20px;
    overflow-y: auto;
    flex-shrink: 0;
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
  }
  #sidebar::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
    color: #fff;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.02em;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    color: var(--text-muted); letter-spacing: 0.15em;
    margin: 22px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: ''; width: 3px; height: 12px;
    background: var(--cyan);
    border-radius: 2px;
  }

  #search {
    width: 100%; padding: 11px 14px;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text); font-size: 13px;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  #search:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.15), 0 0 20px rgba(0, 217, 255, 0.2);
  }
  #search::placeholder { color: var(--text-muted); }

  .btn-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }
  .btn.active {
    background: var(--cyan);
    color: #06070f;
    border-color: transparent;
    font-weight: 600;
  }

  .legend .item {
    display: flex; align-items: center; margin: 6px 0;
    font-size: 12px; color: var(--text-dim);
  }
  .legend .swatch {
    width: 12px; height: 12px; border-radius: 50%;
    margin-right: 10px;
    box-shadow: 0 0 8px currentColor;
  }
  .swatch.gold      { background: #ffd54f; color: #ffd54f; }
  .swatch.orange    { background: #ff8a65; color: #ff8a65; }
  .swatch.gray      { background: #9e9e9e; color: transparent; }
  .swatch.cohort1   { background: #4fc3f7; color: #4fc3f7; }
  .swatch.cohort2   { background: #66d9a7; color: #66d9a7; }
  .swatch.cohort3   { background: #b191f7; color: #b191f7; }
  .swatch.cohort4   { background: #f76bcb; color: #f76bcb; }
  .swatch.cohort5   { background: #ffb74d; color: #ffb74d; }
  .swatch.cohort6   { background: #f06292; color: #f06292; }
  .swatch.cohort7   { background: #4dd0e1; color: #4dd0e1; }
  .swatch.cohort8   { background: #aed581; color: #aed581; }
  .swatch.cohort9   { background: #ce93d8; color: #ce93d8; }

  .rank .row {
    display: flex; align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s ease;
    margin-bottom: 2px;
  }
  .rank .row:hover {
    background: rgba(255,255,255,0.05);
    transform: translateX(2px);
  }
  .rank .rid {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    font-size: 10.5px;
    margin-right: 10px;
    min-width: 56px;
  }
  .rank .rname { flex: 1; color: var(--text); font-weight: 500; }
  .rank .rcount {
    color: var(--cyan); font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  .rank .medal {
    display: inline-block;
    width: 18px; text-align: center;
    margin-right: 6px;
    font-weight: 800;
  }

  /* ─── 캔버스 & 컨트롤 ────────────────── */
  #canvas { flex: 1; position: relative; }
  #cy { width: 100%; height: 100%; }

  .float-panel {
    position: absolute;
    background: var(--glass-strong);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    color: var(--text);
  }

  #topbar {
    top: 20px; right: 20px;
    padding: 10px 16px;
    font-size: 12px;
    display: flex; align-items: center; gap: 14px;
  }
  #topbar .metric { display: flex; align-items: center; gap: 6px; }
  #topbar .metric .k { color: var(--text-muted); }
  #topbar .metric .v {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan); font-weight: 600;
  }
  #topbar .divider { width: 1px; height: 14px; background: var(--border); }
  #topbar .hint { color: var(--text-dim); font-size: 11px; }

  #zoomctl {
    bottom: 24px; right: 24px;
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px; border-radius: 16px;
  }
  #zoomctl button {
    width: 40px; height: 40px;
    background: transparent;
    border: none; border-radius: 10px;
    color: var(--text-dim);
    font-size: 18px; font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
  }
  #zoomctl button:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  #zoomctl button:active { transform: scale(0.92); }
  #zoomctl .sep {
    height: 1px; margin: 4px 6px; background: var(--border);
  }
  #zoomctl svg { width: 18px; height: 18px; }

  #zoominfo {
    bottom: 24px; left: 360px;
    padding: 8px 14px; border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-dim);
  }

  /* ─── 툴팁 ────────────────── */
  #tooltip {
    position: absolute;
    background: var(--glass-strong);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--border-hover);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    max-width: 300px;
    z-index: 20;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0, 217, 255, 0.08);
    animation: tipFade 0.15s ease-out;
  }
  @keyframes tipFade {
    from { opacity: 0; transform: translateY(4px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  #tooltip .tname {
    font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, #fff, #b8c1e0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 3px;
  }
  #tooltip .tid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--cyan);
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  #tooltip .trow {
    display: flex; justify-content: space-between;
    padding: 4px 0;
    border-top: 1px solid var(--border);
  }
  #tooltip .trow:first-of-type { border-top: none; }
  #tooltip .tk { color: var(--text-muted); font-size: 11px; }
  #tooltip .tv { color: var(--text); font-weight: 500; }
  #tooltip .tbadge {
    display: inline-block; margin-top: 10px;
    padding: 3px 8px; border-radius: 6px;
    font-size: 10.5px; font-weight: 600;
    background: linear-gradient(135deg, rgba(255, 213, 79, 0.2), rgba(255, 138, 101, 0.2));
    color: var(--gold);
    border: 1px solid rgba(255, 213, 79, 0.3);
  }
  .rolechip {
    display: inline-block;
    padding: 2px 7px; border-radius: 5px;
    font-size: 10px; font-weight: 600;
    margin-right: 4px; margin-top: 2px;
    background: rgba(255,255,255,0.06);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .rolechip.step { color: var(--gold); border-color: rgba(255,213,79,0.3); }
  .rolechip.jogyo { color: #b0b8cc; }
  .rolechip.chamyeo { color: var(--orange); border-color: rgba(255,138,101,0.3); }
  .rolechip.student { color: var(--cyan); border-color: rgba(0,217,255,0.3); }

  /* 로딩 */
  #loader {
    position: fixed; inset: 0;
    background: var(--bg-0);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    transition: opacity 0.5s ease;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader .spinner {
    width: 40px; height: 40px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<body>
<div id="loader"><div class="spinner"></div></div>

<div id="app">
  <div id="sidebar">
    <div class="logo">낯선대학 계보</div>
    <div class="subtitle">1~9기 · 부모→자식 초대 네트워크</div>

    <div class="section-title">검색</div>
    <input type="text" id="search" placeholder="이름 또는 ID (예: O_1_01)">

    <div class="section-title">기수 필터</div>
    <div class="btn-group" id="cohortFilter">
      <button class="btn active" data-cohort="all">전체</button>
      <button class="btn" data-cohort="1">1</button>
      <button class="btn" data-cohort="2">2</button>
      <button class="btn" data-cohort="3">3</button>
      <button class="btn" data-cohort="4">4</button>
      <button class="btn" data-cohort="5">5</button>
      <button class="btn" data-cohort="6">6</button>
      <button class="btn" data-cohort="7">7</button>
      <button class="btn" data-cohort="8">8</button>
      <button class="btn" data-cohort="9">9</button>
    </div>

    <div class="section-title">레이아웃</div>
    <div class="btn-group" id="layoutSelector">
      <button class="btn active" data-layout="cose">관계망</button>

    <div class="section-title">라벨</div>
    <div class="btn-group" id="labelSelector">
      <button class="btn active" data-label="name">이름</button>

      <button class="btn" data-label="both">이름+ID</button>

    <div class="section-title">범례</div>
    <div class="legend">
      <div class="item"><span class="swatch gold"></span>최초 7인</div>
      <div class="item"><span class="swatch orange"></span>스텝</div>
      <div class="item"><span class="swatch gray"></span>조교</div>
      <div class="item"><span class="swatch cohort1"></span>1기 (2016)</div>
      <div class="item"><span class="swatch cohort2"></span>2기 (2017)</div>
      <div class="item"><span class="swatch cohort3"></span>3기 (2018)</div>
      <div class="item"><span class="swatch cohort4"></span>4기 (2019)</div>
      <div class="item"><span class="swatch cohort5"></span>5기 (2020~2022)</div>
      <div class="item"><span class="swatch cohort6"></span>6기 (2023)</div>
      <div class="item"><span class="swatch cohort7"></span>7기 (2024)</div>
      <div class="item"><span class="swatch cohort8"></span>8기 (2025)</div>
      <div class="item"><span class="swatch cohort9"></span>9기 (2026, 진행중)</div>
    </div>

  </div>

  <div id="canvas">
    <div id="topbar" class="float-panel">
      <div class="metric"><span class="k">노드</span><span class="v" id="stat-nodes">0</span></div>
      <div class="divider"></div>
      <div class="metric"><span class="k">엣지</span><span class="v" id="stat-edges">0</span></div>
    </div>

    <div id="cy"></div>

    <div id="zoominfo" class="float-panel"><span id="zoom-val">100</span>%</div>

    <div id="zoomctl" class="float-panel">
      <button id="zoom-in" title="확대">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="zoom-out" title="축소">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <div class="sep"></div>
      <button id="zoom-fit" title="전체 보기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      </button>

    <div id="tooltip"></div>

<script>
// ── 시트 데이터 소스 (Google Sheets gviz CSV export)
const SHEET_ID = "13doHJH9875nNQZE-tl_5YXi5zdj5l__0NsTnyEC-ZWE";
const SHEETS = ['O_1','O_2','O_3','O_4','O_5','O_6','O_7','O_8','O_9'];
const ORIGINAL_7 = new Set(['O_1_01','O_1_02','O_1_03','O_1_04','O_1_05','O_1_06','O_1_07']);
const CONFIRM_PENDING_PREFIX = '확인중';

const COLOR = {
  original7: '#ffd54f',
  promoted:  '#ff8a65',
  assistant: '#9e9e9e',
  cohort: {
    1: '#4fc3f7', 2: '#66d9a7', 3: '#b191f7', 4: '#f76bcb', 5: '#ffb74d',
    6: '#f06292', 7: '#4dd0e1', 8: '#aed581', 9: '#ce93d8'
  }
};

// ── 데이터 로드
async function loadData() {
  const promises = SHEETS.map(name =>
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${name}`)
      .then(r => {
        if (!r.ok) throw new Error(`fetch ${name} 실패: ${r.status}`);
        return r.text();
      })
      .then(csv => ({ name, rows: parseCSV(csv) }))
  );
  return Promise.all(promises);
}

function parseCSV(text) {
  const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
  return parsed.data;
}

function buildGraph(sheetsData) {
  const nodesMap = new Map();  // id → node
  const edgesMap = new Map();  // "src->tgt" → edge
  const warnings = [];

  // 1) 노드 등록
  for (const { name: sheetName, rows } of sheetsData) {
    const cohort = parseInt(sheetName.split('_')[1]);
    for (const row of rows) {
      const id = (row['id'] || '').trim();
      const studentName = (row['학생'] || '').trim();
      if (!id || !studentName) continue;
      const role = (row['역할'] || '').trim() || '학생';
      const parentName = (row['부모'] || '').trim();

      if (!nodesMap.has(id)) {
        const m = id.match(/^O_(\d+)_/);
        const firstCohort = m ? parseInt(m[1]) : cohort;
        nodesMap.set(id, {
          id, name: studentName,
          firstCohort, cohorts: [], roles: {},
          firstParent: parentName,
          childCount: 0,
          isOriginal7: ORIGINAL_7.has(id),
          pendingParent: false,
          pendingHint: '',
        });
      }
      const node = nodesMap.get(id);
      if (!node.cohorts.includes(cohort)) node.cohorts.push(cohort);
      node.roles[cohort] = role;
      // 부모 확인중 플래그 (첫 참여 기수에서만 판단)
      const pid = (row['부모id'] || '').trim();
      if (cohort === node.firstCohort && pid.startsWith(CONFIRM_PENDING_PREFIX)) {
        node.pendingParent = true;
        node.pendingHint = pid;  // 예: "확인중" 또는 "확인중(Y_5_22)"
      }
    }
  }
  for (const node of nodesMap.values()) {
    node.cohorts.sort((a, b) => a - b);
    node.firstRole = node.roles[node.firstCohort] || '학생';
  }

  // 2) 엣지 등록
  for (const { name: sheetName, rows } of sheetsData) {
    const cohort = parseInt(sheetName.split('_')[1]);
    for (const row of rows) {
      const id = (row['id'] || '').trim();
      const parentId = (row['부모id'] || '').trim();
      if (!id || !parentId) continue;
      if (parentId.startsWith(CONFIRM_PENDING_PREFIX)) continue;
      if (!nodesMap.has(parentId)) {
        warnings.push(`부모 노드 없음: ${parentId} → ${id}`);
        continue;
      }
      const key = `${parentId}->${id}`;
      if (!edgesMap.has(key)) {
        edgesMap.set(key, { id: key, source: parentId, target: id, cohorts: [] });
      }
      const e = edgesMap.get(key);
      if (!e.cohorts.includes(cohort)) e.cohorts.push(cohort);
    }
  }

  // 3) childCount 계산
  for (const edge of edgesMap.values()) {
    const p = nodesMap.get(edge.source);
    if (p) p.childCount++;
  }

  return {
    nodes: Array.from(nodesMap.values()),
    edges: Array.from(edgesMap.values()),
    warnings,
  };
}

// ── 초기화 (fetch → build → 렌더)
let DATA = null;
async function init() {
  try {
    const sheetsData = await loadData();
    DATA = buildGraph(sheetsData);
    if (DATA.warnings.length > 0) console.warn('데이터 경고:', DATA.warnings);
    renderGraph();
  } catch (err) {
    console.error(err);
    document.getElementById('loader').innerHTML =
      `<div style="color:#ff5252;text-align:center;padding:20px;max-width:400px">
        <div style="font-size:24px;margin-bottom:12px">⚠</div>
        <div style="margin-bottom:8px">시트 로드 실패</div>
        <div style="font-size:12px;color:#8891ad">${err.message}</div>
      </div>`;
  }
}

let currentCohortView = 'all';

// 뷰 모드에 따른 노드 색상
// - 'all': 최초 7인은 골드, 나머지는 첫 참여 기수 색
// - 특정 기수 c: 그 기수에서 스텝→오렌지, 조교→회색, 학생/참여→기수 색 (최초 7인은 여전히 골드)
function nodeColorFor(n, view) {
  if (n.isOriginal7) return COLOR.original7;
  if (view === 'all') {
    return COLOR.cohort[n.firstCohort] || '#666';
  }
  const c = parseInt(view);
  const role = n.roles ? n.roles[c] : null;
  if (role === '스텝') return COLOR.promoted;
  if (role === '조교') return COLOR.assistant;
  return COLOR.cohort[c] || '#666';
}
function nodeColor(n) { return nodeColorFor(n, currentCohortView); }
function nodeSize(n) {
  return Math.min(96, Math.max(24, 24 + (n.childCount || 0) * 3));
}
function glowColor(n) { return nodeColor(n); }

let cy;  // 전역 참조

function renderGraph() {
  const elements = [];
  DATA.nodes.forEach(n => {
    elements.push({ data: {
      id: n.id, name: n.name,
      cohorts: n.cohorts, roles: n.roles,
      firstCohort: n.firstCohort, firstRole: n.firstRole, firstParent: n.firstParent,
      isOriginal7: n.isOriginal7, childCount: n.childCount,
      pendingParent: !!n.pendingParent, pendingHint: n.pendingHint || '',
      showPending: false,  // 기수별 모드에서만 true
      color: nodeColor(n), glow: glowColor(n),
      size: nodeSize(n),
      labelName: n.name, labelId: n.id, labelBoth: n.name + '\n' + n.id
    }});
  });
  DATA.edges.forEach(e => {
    elements.push({ data: { id: e.id, source: e.source, target: e.target, cohorts: e.cohorts }});
  });

  cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elements,
  minZoom: 0.15,
  maxZoom: 4,
  wheelSensitivity: 0.6,
  style: [
    {
      selector: 'node',
      style: {
        'background-color': 'data(color)',
        'background-opacity': 0.95,
        'label': 'data(labelName)',
        'color': '#fff',
        'font-size': 11,
        'font-weight': 600,
        'font-family': 'Inter, -apple-system, "Apple SD Gothic Neo", sans-serif',
        'text-valign': 'center',
        'text-halign': 'center',
        'text-wrap': 'wrap',
        'text-outline-color': '#0a0b1e',
        'text-outline-width': 2.5,
        'text-outline-opacity': 0.9,
        'width': 'data(size)',
        'height': 'data(size)',
        'border-width': 2,
        'border-color': 'data(color)',
        'border-opacity': 0.4,
        'underlay-color': 'data(glow)',
        'underlay-opacity': 0.25,
        'underlay-padding': 8,
        'underlay-shape': 'ellipse',
        'transition-property': 'background-opacity, border-width, underlay-opacity, underlay-padding',
        'transition-duration': '180ms'
      }
    },
    {
      selector: 'node[?isOriginal7]',
      style: {
        'border-width': 3,
        'border-color': '#fff8dc',
        'border-opacity': 0.8,
        'font-size': 14,
        'font-weight': 800,
        'underlay-opacity': 0.5,
        'underlay-padding': 14
      }
    },
    // 부모 확인중 — 기수별 모드에서만 활성화 (점선 테두리 + 옅은 링)
    {
      selector: 'node[?showPending]',
      style: {
        'border-width': 3,
        'border-style': 'dashed',
        'border-color': '#ffb74d',
        'border-opacity': 1,
        'underlay-color': '#ffb74d',
        'underlay-opacity': 0.35,
        'underlay-padding': 10
      }
    },
    {
      selector: 'node:active, node:selected',
      style: {
        'underlay-opacity': 0.6,
        'underlay-padding': 16,
        'border-width': 3
      }
    },
    {
      selector: 'edge',
      style: {
        'width': 1.4,
        'line-color': '#4a5178',
        'target-arrow-color': '#6b73a0',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 0.8,
        'curve-style': 'bezier',
        'opacity': 0.55,
        'line-opacity': 0.7,
        'transition-property': 'opacity, width, line-color, target-arrow-color',
        'transition-duration': '200ms'
      }
    },
    { selector: '.faded', style: { 'opacity': 0.06, 'underlay-opacity': 0.05 }},
    { selector: '.hl-down, .hl-up', style: { 'opacity': 1 }},
    // 하위(후손) — 시안
    {
      selector: 'edge.hl-down',
      style: {
        'line-color': '#00d9ff',
        'target-arrow-color': '#00d9ff',
        'width': 2.6,
        'opacity': 1
      }
    },
    {
      selector: 'node.hl-down',
      style: {
        'border-width': 3,
        'border-color': '#00d9ff',
        'border-opacity': 1,
        'underlay-color': '#00d9ff',
        'underlay-opacity': 0.5,
        'underlay-padding': 12
      }
    },
    // 상위(조상) — 분홍
    {
      selector: 'edge.hl-up',
      style: {
        'line-color': '#ff5fb4',
        'target-arrow-color': '#ff5fb4',
        'width': 2.6,
        'opacity': 1
      }
    },
    {
      selector: 'node.hl-up',
      style: {
        'border-width': 3,
        'border-color': '#ff5fb4',
        'border-opacity': 1,
        'underlay-color': '#ff5fb4',
        'underlay-opacity': 0.5,
        'underlay-padding': 12
      }
    },
    {
      selector: '.searchhit',
      style: {
        'border-width': 4,
        'border-color': '#ff3d9a',
        'border-opacity': 1,
        'underlay-color': '#ff3d9a',
        'underlay-opacity': 0.55,
        'underlay-padding': 18
      }
    },
    {
      selector: '.rootpick',
      style: {
        'border-width': 4,
        'border-color': '#ffd54f',
        'underlay-color': '#ffd54f',
        'underlay-opacity': 0.7,
        'underlay-padding': 20
      }
    }
  ]
});

document.getElementById('stat-nodes').textContent = DATA.nodes.length;
document.getElementById('stat-edges').textContent = DATA.edges.length;

const LAYOUTS = {
  cose: {
    name: 'cose-bilkent', animate: 'end', animationDuration: 700, animationEasing: 'ease-out',
    nodeRepulsion: 9000, idealEdgeLength: 95, gravity: 0.28, numIter: 3000, tile: false,
    randomize: false
  },
  dagre: { name: 'dagre', rankDir: 'TB', nodeSep: 32, rankSep: 90, animate: true, animationDuration: 600 },
  concentric: {
    name: 'concentric', animate: true, animationDuration: 600, minNodeSpacing: 22,
    concentric: n => n.data('isOriginal7') ? 100 : (100 - (n.data('firstCohort') || 5) * 15),
    levelWidth: () => 1
  }
};
let currentLayout = 'cose';
function runLayout(name) {
  currentLayout = name;
  // 현재 보이는 요소들만 대상으로 레이아웃 → 사라진 노드가 남긴 공백 없이 재배치
  const visible = cy.elements(':visible');
  const target = visible.length > 0 ? visible : cy.elements();
  target.layout(LAYOUTS[name]).run();
}

// ── 툴팁
const tooltip = document.getElementById('tooltip');
function roleChip(role) {
  const cls = { '스텝':'step', '조교':'jogyo', '참여':'chamyeo', '학생':'student' }[role] || 'student';
  return `<span class="rolechip ${cls}">${role}</span>`;
}
function showTip(node, evt) {
  const d = node.data();
  const roleHtml = d.cohorts.map(c => `<span style="color:var(--text-muted);font-size:10.5px">${c}기</span> ${roleChip(d.roles[c])}`).join(' &nbsp;');
  const isSpecialParent = ['스텝','조교','참여'].includes(d.firstParent);
  const parentLine = (!isSpecialParent && d.firstParent)
    ? `<div class="trow"><span class="tk">부모</span><span class="tv">${d.firstParent}</span></div>` : '';
  const upN   = node.predecessors().nodes().length;
  const downN = node.successors().nodes().length;
  const pendingBadge = (currentCohortView !== 'all' && d.pendingParent)
    ? `<div class="tbadge" style="background:linear-gradient(135deg,rgba(255,183,77,0.25),rgba(255,138,101,0.25));color:#ffb74d;border-color:rgba(255,183,77,0.4)">⚠ 부모 ${d.pendingHint || '확인중'}</div>`
    : '';
  tooltip.innerHTML = `
    <div class="tname">${d.name}</div>
    <div class="tid">${d.id}</div>
    <div style="margin-bottom:10px;line-height:1.9">${roleHtml}</div>
    ${parentLine}
    <div class="trow"><span class="tk">상위 계보</span><span class="tv" style="color:#ff5fb4;font-family:'JetBrains Mono',monospace">${upN}명</span></div>
    <div class="trow"><span class="tk">하위 계보</span><span class="tv" style="color:var(--cyan);font-family:'JetBrains Mono',monospace">${downN}명</span></div>
    ${d.isOriginal7 ? '<div class="tbadge">★ 최초 7인</div>' : ''}
    ${pendingBadge}
  `;
  // 노드의 실제 렌더 bounding box 기준으로 위치 계산 (커서 좌표 아님)
  const rBox = node.renderedBoundingBox();
  const canvasEl = document.getElementById('canvas');
  const cw = canvasEl.clientWidth;
  const ch = canvasEl.clientHeight;
  // 먼저 보이지 않게 표시해서 실제 크기 측정
  tooltip.style.visibility = 'hidden';
  tooltip.style.display = 'block';
  tooltip.style.left = '0px'; tooltip.style.top = '0px';
  const tw = tooltip.offsetWidth  || 280;
  const th = tooltip.offsetHeight || 180;
  // 기본: 노드 우측 옆
  let left = rBox.x2 + 12;
  let top  = rBox.y1;
  // 우측 넘침 → 노드 좌측으로
  if (left + tw > cw - 8) left = rBox.x1 - tw - 12;
  // 그래도 좌측 넘침 → 클램프
  if (left < 8) left = 8;
  // 하단 넘침 → 노드 위쪽으로
  if (top + th > ch - 8) top = Math.max(8, rBox.y2 - th);
  if (top < 8) top = 8;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = top  + 'px';
  tooltip.style.visibility = 'visible';
}
cy.on('mouseover', 'node', e => showTip(e.target, e));
cy.on('mouseout', 'node', () => tooltip.style.display = 'none');
cy.on('pan zoom', () => tooltip.style.display = 'none');

// ── 클릭 → 후손 하이라이트
cy.on('tap', 'node', e => {
  const root = e.target;
  cy.elements().addClass('faded').removeClass('hl-down hl-up rootpick');
  root.successors().removeClass('faded').addClass('hl-down');
  root.predecessors().removeClass('faded').addClass('hl-up');
  root.removeClass('faded').addClass('rootpick');
});
cy.on('tap', e => {
  if (e.target === cy) cy.elements().removeClass('faded hl-down hl-up rootpick');
});

// ── 검색
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  cy.nodes().removeClass('searchhit');
  if (!q) return;
  const hits = cy.nodes().filter(n =>
    n.data('name').toLowerCase().includes(q) || n.data('id').toLowerCase().includes(q)
  );
  hits.addClass('searchhit');
  if (hits.length > 0) cy.animate({ center: { eles: hits }, zoom: 1.3 }, { duration: 500, easing: 'ease-out' });
});

// ── 기수 필터 (표시/숨김 + 색 재계산)
document.querySelectorAll('#cohortFilter button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#cohortFilter button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const c = btn.dataset.cohort;
    currentCohortView = c;
    // 색 + 부모확인중 표시 재계산 (모든 노드)
    const showPendingMode = (c !== 'all');
    cy.nodes().forEach(n => {
      const nData = {
        isOriginal7: n.data('isOriginal7'),
        firstCohort: n.data('firstCohort'),
        roles: n.data('roles')
      };
      const col = nodeColorFor(nData, c);
      n.data('color', col);
      n.data('glow', col);
      // 부모 확인중은 기수별 모드에서만 표시
      n.data('showPending', showPendingMode && n.data('pendingParent'));
    });
    // 표시/숨김
    if (c === 'all') {
      cy.elements().style('display', 'element');
    } else {
      const cn = parseInt(c);
      cy.nodes().forEach(n => n.style('display', n.data('cohorts').includes(cn) ? 'element' : 'none'));
      cy.edges().forEach(e => e.style('display', e.data('cohorts').includes(cn) ? 'element' : 'none'));
    }
    // 보이는 노드들로 재배치
    runLayout(currentLayout);
  });
});

// ── 레이아웃
document.querySelectorAll('#layoutSelector button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#layoutSelector button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    runLayout(btn.dataset.layout);
  });
});

// ── 라벨
document.querySelectorAll('#labelSelector button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#labelSelector button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.label;
    const attr = mode === 'id' ? 'labelId' : (mode === 'both' ? 'labelBoth' : 'labelName');
    cy.style().selector('node').style('label', 'data(' + attr + ')').update();
  });
});

// ── 줌 컨트롤
const zoomVal = document.getElementById('zoom-val');
function updateZoomLabel() { zoomVal.textContent = Math.round(cy.zoom() * 100); }
cy.on('zoom', updateZoomLabel);
function smoothZoom(factor) {
  const z = cy.zoom() * factor;
  const c = { x: cy.width()/2, y: cy.height()/2 };
  cy.animate({ zoom: { level: Math.max(cy.minZoom(), Math.min(cy.maxZoom(), z)), renderedPosition: c }},
             { duration: 220, easing: 'ease-out' });
}
document.getElementById('zoom-in').onclick  = () => smoothZoom(1.25);
document.getElementById('zoom-out').onclick = () => smoothZoom(0.8);
document.getElementById('zoom-fit').onclick = () => cy.animate({ fit: { padding: 40 }}, { duration: 500, easing: 'ease-out' });
document.getElementById('zoom-focus').onclick = () => {
  const focused = cy.elements('.rootpick, .hl-down, .hl-up');
  if (focused.length > 0) {
    cy.animate({ fit: { eles: focused, padding: 60 }}, { duration: 500, easing: 'ease-out' });
  }
};

  // ── 초기 레이아웃 + 로더 제거
  runLayout('cose');
  setTimeout(() => {
    document.getElementById('loader').classList.add('gone');
    updateZoomLabel();
  }, 400);
}  // renderGraph 종료

// ── 시작
init();
</script>
</body>
</html>
